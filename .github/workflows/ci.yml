name: CI

on:
  pull_request:
    paths-ignore:
      - '**.md'
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'

# Cancel in-progress runs for the same branch/PR to avoid wasting CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      # Dependencies' install scripts are not needed to lint, build or test.
      - name: Install dependencies
        run: 'npm ci --ignore-scripts'

      - name: Run lint
        run: 'npm run lint'

      - name: Run build
        run: 'npm run build'

      # Unit tests with a mocked API: no network, no API key.
      - name: Run tests
        run: 'npm test'
